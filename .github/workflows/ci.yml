name: CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m ruff check .
      - run: python -m mypy --ignore-missing-imports --follow-imports=silent .
      - run: python -m pytest --cov=prahari --cov=agent --cov-report=term --cov-fail-under=45 -q

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag prahari:ci .
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: prahari:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
