[project]
name = "prahari"
version = "0.1.0"
description = "A local-first AI on-call engineer demo"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "httpx>=0.28,<1.0",
  "prometheus-client>=0.22,<1.0",
  "structlog>=25.4,<26.0",
  "python-dotenv>=1.1,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9.0", "gitpython>=3.1,<4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
