[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "prahari"
version = "0.1.0"
description = "A local-first AI on-call engineer demo"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "httpx>=0.28,<1.0",
  "prometheus-client>=0.22,<1.0",
  "structlog>=25.4,<26.0",
  "python-dotenv>=1.1,<2.0",
  "sentry-sdk>=2.68,<3.0",
  "SQLAlchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "alembic>=1.14,<2.0",
  "PyJWT[crypto]>=2.10,<3.0",
  "opentelemetry-api>=1.30,<2.0",
  "opentelemetry-sdk>=1.30,<2.0",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2.0",
  "anthropic>=0.50,<1.0",
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9.0", "gitpython>=3.1,<4.0", "ruff>=0.11,<1.0", "mypy>=1.15,<2.0", "pytest-cov>=6.0,<7.0", "types-PyYAML>=6.0,<7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["agent*", "ci*", "dashboard*", "deps*", "detector*", "faults*", "otel*", "prahari*", "risk*", "seed*", "slo*", "target_app*", "traffic*", "verifier*"]
exclude = ["data*", "artifacts*", "incidents*", "tests*"]
